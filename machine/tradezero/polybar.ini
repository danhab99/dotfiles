; Polybar for tradezero — mirrors machine/tradezero/i3blocks.conf modules.
; Edge-to-edge; pseudo-transparency (no compositor). See docs/kvm-display-seizure.md.

[colors]
; ARGB backgrounds — alpha is blended against the root wallpaper when
; pseudo-transparency = true (urxvt-style; no compositor).
background = #a02f343f
background-alt = #c03a4050
foreground = #f3f4f5
foreground-dim = #c8c9b8
primary = #c0caf5
urgent = #E53935
separator = #a0a288

[bar/main]
monitor = ${env:MONITOR:}
monitor-fallback =
bottom = true
width = 100%
offset-x = 0
offset-y = 0
height = 30
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 0
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 1

font-0 = monospace:size=11;2

modules-left = i3
modules-center =
; Order matches i3blocks.conf: volume mem cpu disk net bat time temp caps num
modules-right = pulseaudio memory cpu filesystem network battery date temperature caps num

separator = |
separator-foreground = ${colors.separator}

cursor-click = pointer
enable-ipc = true

override-redirect = false

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
pin-workspaces = true
strip-wsnumbers = true

label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = ${colors.urgent}

label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.primary}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground-dim}
label-unfocused-padding = 1

label-visible = %index%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1

label-urgent = %index%
label-urgent-background = ${colors.urgent}
label-urgent-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = ♪ %percentage%%
label-muted = ♪ muted
label-muted-foreground = ${colors.foreground-dim}
click-right = pavucontrol

[module/memory]
type = internal/memory
interval = 10
format = <label>
label = MEM %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 1
format = <label>
label = CPU %percentage%%

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
format-mounted = <label-mounted>
; Match i3blocks disk format: used/total(perc%)
label-mounted = DISK=%used%/%total%(%percentage_used%%)
format-unmounted =
label-unmounted =

[module/network]
type = internal/network
interface = wlp0s20f3
interval = 1
accumulate = true
format-connected = <label-connected>
label-connected = ↓%downspeed:8% ↑%upspeed:8%
format-disconnected = <label-disconnected>
label-disconnected = net down
label-disconnected-foreground = ${colors.foreground-dim}

[module/temperature]
type = internal/temperature
thermal-zone = 0
interval = 5
warn-temperature = 80
format = <label>
label = TEMP %temperature-c%
format-warn = <label-warn>
label-warn = TEMP %temperature-c%
label-warn-foreground = ${colors.urgent}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 30
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
label-charging = BAT %percentage%%+
label-discharging = BAT %percentage%%
label-full = BAT full

[module/date]
type = internal/date
interval = 1
date = %a %m-%d-%y
time = %H:%M:%S
label = %date% %time%

[module/caps]
type = custom/script
exec = /etc/nixos/scripts/polybar-caps.sh
interval = 2
format = <label>
label = %output%
label-foreground = ${colors.urgent}

[module/num]
type = custom/script
exec = /etc/nixos/scripts/polybar-num.sh
interval = 2
format = <label>
label = %output%
label-foreground = ${colors.urgent}

[settings]
screenchange-reload = true
; Same trick as urxvt: composite bar chrome against the root wallpaper
; pixmap (_XROOTPMAP_ID). No picom required. Does not see through windows.
pseudo-transparency = true
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

[global/wm]
margin-top = 0
margin-bottom = 0
